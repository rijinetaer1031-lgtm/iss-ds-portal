<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS-DS | Upload Document</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; min-height: 100vh; background: #f0f4f8; display: flex; }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #0f2744;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 20px;
            position: fixed;
            height: 100vh;
        }
        .brand { font-size: 20px; font-weight: bold; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; color: #61b5ff; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .nav-link { padding: 12px 15px; border-radius: 8px; color: #b0c4de; text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { background: #2878c8; color: white; }
        .sidebar-footer { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; font-size: 13px; color: #9bb2cd; }
        .sidebar-footer a { color: #ff8080; text-decoration: none; display: block; margin-top: 8px; font-weight: bold; }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex-grow: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .upload-container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #0f2744; font-size: 24px; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; color: #334155; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
        input[type="text"], input[type="date"], select {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #f8fafc;
        }
        input:focus, select:focus { border-color: #2878c8; background: white; }

        .file-box {
            border: 2px dashed #cbd5e1; border-radius: 10px; padding: 25px; text-align: center; background: #f8fafc; transition: 0.2s;
        }
        .file-box:hover { border-color: #2878c8; background: #f1f5f9; }
        input[type="file"] { border: none; padding: 5px; background: transparent; width: 100%; }

        button[type="submit"] {
            width: 100%; padding: 14px; border: none; border-radius: 8px; background: #2878c8; color: white; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button[type="submit"]:hover { background: #1769aa; }
        .required { color: #dc2626; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand">📁 ISS-DS Portal</div>
            <div class="nav-links">
                <a href="/dashboard" class="nav-link">📊 Dashboard</a>
                <a href="/upload" class="nav-link active">➕ Upload Document</a>
                <a href="/activity-log" class="nav-link">📋 Activity Log</a>
                <a href="/admin" class="nav-link">⚙️ Admin Panel</a>
            </div>
        </div>
        <div class="sidebar-footer">
            <a href="/logout">🚪 Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="upload-container">
            <div class="header">
                <h1>Upload Document</h1>
                <p>Add a new document version to the ISS-DS repository</p>
            </div>

            <form action="/api/upload" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="title">Document Title <span class="required">*</span></label>
                    <input type="text" id="title" name="title" required placeholder="e.g., Q3 Meeting Minutes">
                </div>

                <div class="form-group">
                    <label for="category">Category <span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Reports">📊 Reports</option>
                        <option value="Memos">📝 Memos</option>
                        <option value="Records">📂 Records</option>
                        <option value="Finance">💰 Finance</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Document Date <span class="required">*</span></label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="file">Select Document <span class="required">*</span></label>
                    <div class="file-box">
                        <p style="color: #64748b; font-size: 13px; margin-bottom: 10px;">Choose the file you want to upload</p>
                        <input type="file" id="file" name="file" required>
                    </div>
                </div>

                <button type="submit">Upload Document</button>
            </form>
        </div>
    </div>

</body>
</html>
