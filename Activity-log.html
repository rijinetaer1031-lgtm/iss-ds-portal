<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISS-DS | Activity Log</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Inter", sans-serif; }
      body { background: #f4f2f9; display: flex; min-height: 100vh; color: #17142b; overflow-x: hidden; }

      /* Unified Sidebar */
      .sidebar { width: 260px; background: linear-gradient(180deg, #23b1ca 0%, #331780 100%); color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; border-top-right-radius: 24px; border-bottom-right-radius: 24px; padding: 20px 0; z-index: 10; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 5px 0 25px rgba(51, 23, 128, 0.15); overflow-y: auto; }
      .sidebar::-webkit-scrollbar { display: none; }
      .sidebar.closed { transform: translateX(-100%); }
      .logo-container { text-align: center; margin-bottom: 20px; padding: 30px 20px 0 20px; position: relative; }
      .sidebar-logo { width: 140px; height: auto; background-color: transparent; padding: 0; filter: drop-shadow(0px 8px 12px rgba(124, 92, 255, 0.4)); margin-bottom: 10px; transition: 0.3s; }
      .sidebar-logo:hover { transform: scale(1.05); }
      .close-btn { position: absolute; top: 20px; left: 20px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: all 0.2s ease; border: none; z-index: 100; color: white; background: rgba(255, 255, 255, 0.1); }
      .close-btn:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.2); }
      .nav-menu { display: flex; flex-direction: column; padding: 0 15px; flex-grow: 1; margin-top: 10px; margin-bottom: 20px; }
      .nav-link { display: flex; align-items: center; gap: 15px; padding: 14px 20px; color: #d9d5ea; text-decoration: none; border-radius: 12px; margin-bottom: 8px; font-size: 14px; transition: all 0.3s ease; }
      .nav-link:hover, .nav-link.active { background: rgba(255, 255, 255, 0.15); color: white; font-weight: 600; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); backdrop-filter: blur(5px); }
      .nav-link i { font-size: 18px; width: 20px; text-align: center; }
      .sidebar-profile { padding: 20px; margin: auto 15px 20px 15px; background: rgba(0, 0, 0, 0.15); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; display: flex; flex-direction: column; align-items: stretch; gap: 16px; justify-content: center; backdrop-filter: blur(10px); }
      .profile-info { display: flex; align-items: center; gap: 12px; font-size: 13px; width: 100%; }
      .profile-info i { font-size: 28px; color: #34d399; }
      .logout-btn { color: #f08a9b; text-decoration: none; font-size: 13px; font-weight: 600; padding: 10px; border-radius: 10px; background: rgba(240, 138, 155, 0.1); display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; width: 100%; }
      .logout-btn:hover { background: rgba(240, 138, 155, 0.2); color: #ffb3c1; }

      .open-btn {
        position: fixed; top: 25px; left: 25px; font-size: 20px; color: #7c5cff; cursor: pointer; display: none;
        background: #ffffff; border: 1px solid #e7e2f2; padding: 12px 15px; border-radius: 50px;
        box-shadow: 0 4px 15px rgba(23, 20, 43, 0.08); transition: 0.2s; z-index: 1000;
      }
      .open-btn:hover { background: #f0eef5; color: #5b43c7; transform: scale(1.05); }
      .main-content.expanded .open-btn { display: flex !important; align-items: center; justify-content: center; }

      /* Main Content Layout */
      .main-content { margin-left: 260px; flex-grow: 1; padding: 30px 45px; display: flex; flex-direction: column; gap: 25px; width: calc(100% - 260px); transition: margin-left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
      .main-content.expanded { margin-left: 0; padding-left: 45px; width: 100%; }

      /* Creative Welcome Banner */
      .welcome-banner { background: linear-gradient(135deg, #7c5cff 0%, #23b1ca 100%); border-radius: 24px; padding: 35px 45px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 15px 35px rgba(124, 92, 255, 0.25); position: relative; overflow: hidden; }
      .welcome-banner::before { content: ''; position: absolute; top: -50px; right: -50px; width: 250px; height: 250px; background: rgba(255, 255, 255, 0.1); border-radius: 50%; backdrop-filter: blur(10px); }
      .welcome-text h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
      .welcome-text p { font-size: 15px; color: rgba(255, 255, 255, 0.9); }
      .date-badge { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); padding: 12px 25px; border-radius: 50px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255, 255, 255, 0.3); }

      /* Card & Clean Table Styling */
      .card { background: white; border-radius: 24px; padding: 30px; box-shadow: 0 10px 30px rgba(23, 20, 43, 0.03); border: 1px solid #e7e2f2; }
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
      .header h2 { font-size: 18px; font-weight: 700; color: #17142b; display: flex; align-items: center; gap: 10px; }
      
      .filter-group { display: flex; align-items: center; gap: 10px; }
      .date-picker-input { padding: 8px 14px; border: 2px solid #e7e2f2; border-radius: 12px; font-size: 13px; font-weight: 600; color: #17142b; background: #f8f7fb; outline: none; cursor: pointer; transition: 0.2s; }
      .date-picker-input:focus { border-color: #7c5cff; background: white; }
      
      .clear-filter-btn { background: #d6455d; color: white; border: none; padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; display: none; }
      .clear-filter-btn.active { display: inline-block; }
      .clear-filter-btn:hover { opacity: 0.9; }

      table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; }
      th { padding: 12px 16px; font-size: 11px; font-weight: 700; color: #918ba1; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid #e7e2f2; background: #fcfbfe; }
      th:first-child { border-top-left-radius: 12px; }
      th:last-child { border-top-right-radius: 12px; }
      td { padding: 16px; font-size: 13.5px; color: #17142b; border-bottom: 1px solid #f4f2f9; vertical-align: middle; }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: #faf9fc; }

      .date-pill { display: inline-flex; align-items: center; gap: 6px; background: #f5f3fa; color: #5b43c7; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12.5px; border: 1px solid #e7e2f2; }
      .action-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: #eee9ff; color: #5b43c7; }
      
      @media (max-width: 768px) {
        .sidebar { transform: translateX(-100%); }
        .sidebar:not(.closed) { transform: translateX(0); }
        .main-content { margin-left: 0 !important; width: 100% !important; padding: 20px 18px !important; }
        .open-btn { display: flex !important; align-items: center; justify-content: center; }
        .welcome-banner { flex-direction: column; align-items: flex-start; gap: 15px; padding: 25px 20px; }
      }
      
      .swal2-popup.swal2-custom-popup {
        width: 360px !important;
        max-width: 90vw !important;
        padding: 25px 20px !important;
        border-radius: 28px !important;
        font-family: 'Inter', sans-serif !important;
        box-shadow: 0 20px 40px rgba(23, 20, 43, 0.12) !important;
        border: 1px solid #e7e2f2 !important;
      }
    </style>
  </head>

  <body>
    <!-- Unified Sidebar -->
    <div class="sidebar">
      <div class="logo-container">
        <i class="fa-solid fa-bars close-btn" id="closeSidebar" title="Collapse Menu"></i>
        <img src="/nobglogo.png" alt="CSUISS Logo" class="sidebar-logo" />
      </div>
      <div class="nav-menu">
        <a href="/dashboard" class="nav-link"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="/upload" class="nav-link"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Document</a>
        <a href="/documents" class="nav-link"><i class="fa-regular fa-file-lines"></i> My Documents</a>
        <a href="/activity-log" class="nav-link active"><i class="fa-solid fa-chart-line"></i> Activity Log</a>
        <a href="/recycle-bin" class="nav-link"><i class="fa-solid fa-trash-can-arrow-up"></i> Recycle Bin</a>
        <a href="/admin" class="nav-link"><i class="fa-solid fa-gear"></i> Admin Panel</a>
      </div>
      <div class="sidebar-profile">
        <div class="profile-info">
          <i class="fa-solid fa-circle-user"></i>
          <div>
            <div style="font-size: 11px; color: #a7f3d0; margin-bottom: 2px;">ISS-DS Portal</div>
            <div style="font-weight: bold; color: white;" id="userDisplay">User</div>
          </div>
        </div>
        <a href="/logout" class="logout-btn" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
      </div>
    </div> 

    <!-- Main Content -->
    <div class="main-content">
      <i class="fa-solid fa-bars open-btn" id="openSidebar" title="Open Menu"></i>

      <div class="welcome-banner">
        <div class="welcome-text">
          <h1>Activity Log 📊</h1>
          <p>Track system audit trails and user actions cleanly.</p>
        </div>
        <div class="date-badge">
          <i class="fa-regular fa-calendar-check"></i>
          <span id="currentDateDisplay">Date</span>
        </div>
      </div>

      <div class="card">
        <div class="header">
          <h2><i class="fa-solid fa-list-check" style="color: #7c5cff;"></i> Audit Trail History</h2>
          
          <!-- Quick Date Filter Input -->
          <div class="filter-group">
            <label for="dateFilter" style="font-size: 12px; font-weight: 600; color: #6b6678; text-transform: uppercase;">Filter Date:</label>
            <input type="date" id="dateFilter" class="date-picker-input" onchange="filterLogsByPicker(this.value)" />
            <button class="clear-filter-btn" id="clearBtn" onclick="clearDateFilter()">Reset</button>
          </div>
        </div>

        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>User</th>
                <th>Action</th>
                <th>Target Document</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody id="activityTableBody">
              <!-- Populated via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-US', options);

      let allActivityLogs = [];

      async function fetchActivityLogs() {
        try {
          const response = await fetch('/api/activity');
          if (response.ok) {
            allActivityLogs = await response.json();
            renderLogs(allActivityLogs);
          } else {
            document.getElementById('activityTableBody').innerHTML = `<tr><td colspan="5" style="text-align: center; color: #d6455d; padding: 30px;">Access Denied: Administrator or President privileges required.</td></tr>`;
          }
        } catch (error) {
          console.error("Error fetching activity logs:", error);
        }
      }

      window.onload = fetchActivityLogs;

      function renderLogs(logs) {
        const tbody = document.getElementById('activityTableBody');
        tbody.innerHTML = '';

        if (logs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #918ba1; padding: 30px;">No activity logs found for this date.</td></tr>`;
          return;
        }

        logs.forEach(log => {
          const rawDate = new Date(log.action_date.replace(" ", "T"));
          const formattedDate = rawDate.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

          tbody.innerHTML += `
            <tr>
              <td>
                <span class="date-pill">
                  <i class="fa-regular fa-calendar"></i> ${formattedDate}
                </span>
              </td>
              <td><strong>@${log.username}</strong></td>
              <td><span class="action-badge">${log.action_type}</span></td>
              <td style="color: #6b6678;">${log.document_id ? `Doc ID: ${log.document_id}` : 'N/A'}</td>
              <td style="color: #6b6678;">${log.result}</td>
            </tr>
          `;
        });
      }

      window.filterLogsByPicker = function(selectedDate) {
        if (!selectedDate) return;
        
        const filtered = allActivityLogs.filter(log => {
          const logDateStr = new Date(log.action_date.replace(" ", "T")).toISOString().split('T')[0];
          return logDateStr === selectedDate;
        });

        document.getElementById('clearBtn').classList.add('active');
        renderLogs(filtered);
      }

      window.clearDateFilter = function() {
        document.getElementById('dateFilter').value = '';
        document.getElementById('clearBtn').classList.remove('active');
        renderLogs(allActivityLogs);
      }

      const sidebar = document.querySelector(".sidebar");
      const mainContent = document.querySelector(".main-content");
      document.getElementById("closeSidebar").addEventListener("click", () => { sidebar.classList.add("closed"); mainContent.classList.add("expanded"); });
      document.getElementById("openSidebar").addEventListener("click", () => { sidebar.classList.remove("closed"); mainContent.classList.remove("expanded"); });

      // Fetch current user's role for the sidebar profile cleanly
      fetch("/api/current-user")
        .then((response) => response.json())
        .then((data) => {
          const userDisplayEl = document.getElementById("userDisplay");
          const userRole = data.role || data.access_level || "User";
          if (userDisplayEl) {
            userDisplayEl.innerText = `@${userRole}`;
          }
        })
        .catch((error) => console.error("Error fetching user role:", error));
    </script>
  </body>
</html>
