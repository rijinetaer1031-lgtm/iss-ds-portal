<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS-DS | Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; min-height: 100vh; background: #f0f4f8; display: flex; }

        .sidebar {
            width: 260px; background: #0f2744; color: white; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 20px; position: fixed; height: 100vh;
        }
        .brand { font-size: 20px; font-weight: bold; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; color: #61b5ff; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .nav-link { padding: 12px 15px; border-radius: 8px; color: #b0c4de; text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { background: #2878c8; color: white; }
        .sidebar-footer { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; font-size: 13px; color: #9bb2cd; }
        .sidebar-footer a { color: #ff8080; text-decoration: none; display: block; margin-top: 8px; font-weight: bold; }

        .main-content { margin-left: 260px; flex-grow: 1; padding: 40px; display: flex; flex-direction: column; gap: 25px; }
        .card { background: white; padding: 30px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; }
        
        .header { margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; }
        h1 { color: #0f2744; font-size: 22px; margin-bottom: 4px; }
        h2 { color: #0f2744; font-size: 18px; margin-bottom: 15px; }
        p { color: #666; font-size: 14px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; color: #334155; font-weight: bold; margin-bottom: 6px; font-size: 13px; }
        input, select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #f8fafc; }
        input:focus, select:focus { border-color: #2878c8; background: white; }
        
        button[type="submit"] { grid-column: span 2; padding: 13px; border: none; border-radius: 8px; background: #2878c8; color: white; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        button[type="submit"]:hover { background: #1769aa; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        th { background-color: #f8fafc; color: #475569; font-weight: bold; }
        tbody tr:hover { background-color: #f8fafc; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 6px; background: #e2e8f0; color: #334155; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand">📁 ISS-DS Portal</div>
            <div class="nav-links">
                <a href="/dashboard" class="nav-link">📊 Dashboard</a>
                <a href="/upload" class="nav-link">➕ Upload Document</a>
                <a href="/activity-log" class="nav-link">📋 Activity Log</a>
                <a href="/admin" class="nav-link active">⚙️ Admin Panel</a>
            </div>
        </div>
        <div class="sidebar-footer">
            <a href="/logout">🚪 Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="header">
                <h1>Admin Panel</h1>
                <p>Manage user accounts and role permissions</p>
            </div>

            <h2>Create New User</h2>
            <form action="/api/users" method="POST">
                <div class="form-grid">
                    <div>
                        <label>Full Name</label>
                        <input type="text" name="full_name" required placeholder="e.g. john doe">
                    </div>
                    <div>
                        <label>Username</label>
                        <input type="text" name="username" required placeholder="Unique username">
                    </div>
                    <div>
                        <label>Password</label>
                        <input type="password" name="password" required placeholder="Temporary password">
                    </div>
                    <div>
                        <label>Access Level</label>
                        <select name="access_level" required>
                            <option value="Officer">Officer</option>
                            <option value="Treasurer">Treasurer</option>
                            <option value="President">President</option>
                            <option value="Administrator">Administrator</option>
                        </select>
                    </div>
                    <button type="submit">Create User Account</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Existing User Accounts</h2>
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Username</th>
                        <th>Access Level</th>
                        <th>Status</th>
                        <th>Date Created</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchUsers() {
            try {
                const response = await fetch('/api/users');
                if (!response.ok) return;
                const users = await response.json();
                const tableBody = document.getElementById('userTableBody');
                tableBody.innerHTML = '';
                
                users.forEach(user => {
                    const date = new Date(user.date_created).toLocaleDateString();
                    const row = `<tr>
                        <td style="font-weight: bold; color: #0f2744;">${user.full_name}</td>
                        <td style="color: #64748b;">@${user.username}</td>
                        <td><span class="tag">${user.access_level}</span></td>
                        <td style="color: #64748b;">${user.status}</td>
                        <td style="color: #64748b;">${date}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error('Error fetching users:', error);
            }
        }
        window.onload = fetchUsers;
    </script>
</body>
</html>
