<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISS-DS | My Documents</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Inter", sans-serif; }
      body { background: #f4f2f9; display: flex; min-height: 100vh; color: #17142b; overflow-x: hidden; }

      /* Unified Sidebar */
      .sidebar { width: 260px; background: linear-gradient(180deg, #23b1ca 0%, #331780 100%); color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; border-top-right-radius: 24px; border-bottom-right-radius: 24px; padding: 20px 0; z-index: 10; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 5px 0 25px rgba(51, 23, 128, 0.15); overflow-y: auto; }
      .sidebar::-webkit-scrollbar { display: none; }
      .sidebar.closed { transform: translateX(-100%); }
      .logo-container { text-align: center; margin-bottom: 20px; padding: 30px 20px 0 20px; position: relative; }
      .sidebar-logo { width: 140px; height: auto; background-color: transparent; padding: 0; filter: drop-shadow(0px 8px 12px rgba(124, 92, 255, 0.4)); margin-bottom: 10px; transition: 0.3s; }
      .sidebar-logo:hover { transform: scale(1.05); }
      .close-btn { position: absolute; top: 20px; left: 20px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: all 0.2s ease; border: none; z-index: 100; color: white; background: rgba(255, 255, 255, 0.1); }
      .close-btn:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.2); }
      .nav-menu { display: flex; flex-direction: column; padding: 0 15px; flex-grow: 1; margin-top: 10px; margin-bottom: 20px; }
      .nav-link { display: flex; align-items: center; gap: 15px; padding: 14px 20px; color: #d9d5ea; text-decoration: none; border-radius: 12px; margin-bottom: 8px; font-size: 14px; transition: all 0.3s ease; }
      .nav-link:hover, .nav-link.active { background: rgba(255, 255, 255, 0.15); color: white; font-weight: 600; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); backdrop-filter: blur(5px); }
      .nav-link i { font-size: 18px; width: 20px; text-align: center; }
      .sidebar-profile { padding: 20px; margin: auto 15px 20px 15px; background: rgba(0, 0, 0, 0.15); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; display: flex; flex-direction: column; align-items: stretch; gap: 16px; justify-content: center; backdrop-filter: blur(10px); }
      .profile-info { display: flex; align-items: center; gap: 12px; font-size: 13px; width: 100%; }
      .profile-info i { font-size: 28px; color: #34d399; }
      .logout-btn { color: #f08a9b; text-decoration: none; font-size: 13px; font-weight: 600; padding: 10px; border-radius: 10px; background: rgba(240, 138, 155, 0.1); display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; width: 100%; }
      .logout-btn:hover { background: rgba(240, 138, 155, 0.2); color: #ffb3c1; }
      
      .open-btn {
        position: fixed; top: 25px; left: 25px; font-size: 20px; color: #7c5cff; cursor: pointer; display: none;
        background: #ffffff; border: 1px solid #e7e2f2; padding: 12px 15px; border-radius: 50px;
        box-shadow: 0 4px 15px rgba(23, 20, 43, 0.08); transition: 0.2s; z-index: 1000;
      }
      .open-btn:hover { background: #f0eef5; color: #5b43c7; transform: scale(1.05); }
      .main-content.expanded .open-btn { display: flex !important; align-items: center; justify-content: center; }

      /* Main Content Layout */
      .main-content { margin-left: 260px; flex-grow: 1; padding: 30px 45px; display: flex; flex-direction: column; gap: 25px; width: calc(100% - 260px); transition: margin-left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
      .main-content.expanded { margin-left: 0; padding-left: 45px; width: 100%; }

      /* Creative Welcome Banner */
      .welcome-banner { background: linear-gradient(135deg, #7c5cff 0%, #23b1ca 100%); border-radius: 24px; padding: 35px 45px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 15px 35px rgba(124, 92, 255, 0.25); position: relative; overflow: hidden; }
      .welcome-banner::before { content: ''; position: absolute; top: -50px; right: -50px; width: 250px; height: 250px; background: rgba(255, 255, 255, 0.1); border-radius: 50%; backdrop-filter: blur(10px); }
      .welcome-text h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
      .welcome-text p { font-size: 15px; color: rgba(255, 255, 255, 0.9); }
      .date-badge { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); padding: 12px 25px; border-radius: 50px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255, 255, 255, 0.3); }

      /* Action Bar */
      .action-bar { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
      .search-container { background: #ffffff; padding: 15px 25px; border-radius: 50px; box-shadow: 0 8px 25px rgba(23, 20, 43, 0.05); border: 1px solid #e7e2f2; display: flex; align-items: center; gap: 15px; flex-grow: 1; }
      .search-container input { flex-grow: 1; border: none; outline: none; font-size: 15px; color: #17142b; background: transparent; }
      
      .action-btn-custom { background: linear-gradient(135deg, #7c5cff 0%, #5b43c7 100%); color: white; border: none; padding: 15px 25px; border-radius: 50px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px rgba(124, 92, 255, 0.3); transition: 0.3s; white-space: nowrap; text-decoration: none; }
      .action-btn-custom:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(124, 92, 255, 0.4); }

      /* Creative Folder Grid View */
      .folders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; margin-top: 10px; }
      .folder-card { background: #ffffff; border: 1px solid #e7e2f2; border-radius: 24px; padding: 30px 20px; text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 10px 25px rgba(23, 20, 43, 0.03); position: relative; overflow: hidden; }
      .folder-card::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #7c5cff, #23b1ca); opacity: 0; transition: 0.3s; }
      .folder-card:hover { transform: translateY(-8px); border-color: #d2cbe6; box-shadow: 0 20px 40px rgba(124, 92, 255, 0.12); }
      .folder-card:hover::after { opacity: 1; }
      
      .folder-icon-wrapper { width: 70px; height: 70px; border-radius: 20px; background: #eee9ff; color: #7c5cff; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 20px; transition: 0.3s; box-shadow: inset 0 2px 6px rgba(124, 92, 255, 0.1); position: relative; }
      .folder-card:hover .folder-icon-wrapper { background: #7c5cff; color: white; transform: scale(1.1) rotate(5deg); }
      .folder-card h3 { font-size: 16px; font-weight: 700; color: #17142b; margin-bottom: 6px; }
      .folder-card p { font-size: 13px; color: #918ba1; font-weight: 500; }

      .subfolder-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; opacity: 0; transition: 0.2s; }
      .folder-card:hover .subfolder-actions { opacity: 1; }
      .subfolder-action-btn { background: #fff3cd; color: #856404; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: 0.2s; }
      .subfolder-action-btn.delete { background: #ffe4e8; color: #d6455d; }
      .subfolder-action-btn:hover { transform: scale(1.1); }

      /* Active Folder View Header */
      .folder-view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; background: white; padding: 22px 35px; border-radius: 20px; border: 1px solid #e7e2f2; box-shadow: 0 4px 15px rgba(23, 20, 43, 0.02); flex-wrap: wrap; gap: 15px; }
      .back-btn { background: #eee9ff; color: #5b43c7; border: none; padding: 12px 20px; border-radius: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
      .back-btn:hover { background: #7c5cff; color: white; }

      /* Document List Items */
      .doc-list-item { display: flex; align-items: center; justify-content: space-between; background: #ffffff; padding: 20px 25px; border-radius: 18px; margin-bottom: 14px; box-shadow: 0 4px 15px rgba(23, 20, 43, 0.03); border: 1px solid #e7e2f2; gap: 20px; transition: all 0.3s ease; }
      .doc-list-item:hover { border-color: #d2cbe6; transform: translateY(-2px); box-shadow: 0 10px 25px rgba(23, 20, 43, 0.06); }
      .doc-info-wrapper { display: flex; align-items: center; gap: 20px; flex-grow: 1; min-width: 0; }
      .list-icon { font-size: 34px; width: 45px; text-align: center; }
      .icon-pdf { color: #d6455d; } .icon-xls { color: #16805b; } .icon-doc { color: #6a4de0; }
      .doc-details h4 { font-size: 15px; font-weight: 700; color: #17142b; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .doc-details p { font-size: 12px; color: #918ba1; margin: 0; display: flex; gap: 15px; font-weight: 500; }
      .doc-actions-wrapper { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
      
      .approval-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .badge-approved { background: #e8f8f1; color: #16805b; border: 1px solid #b9f3d8; }
      .badge-pending { background: #fbf3e2; color: #a97819; border: 1px solid #f0c978; }

      .btn-view { border: 1px solid #e7e2f2; color: #5b43c7; background: #ffffff; padding: 10px 18px; border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
      .btn-view:hover { background: #7c5cff; color: white; border-color: #7c5cff; }
      .btn-download, .btn-delete, .btn-edit { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.3s; border: none; cursor: pointer; }
      .btn-download { background: #f5f3fa; color: #17142b; }
      .btn-download:hover { background: #23b1ca; color: white; }
      .btn-edit { background: #fbf3e2; color: #a97819; }
      .btn-edit:hover { background: #f0c978; color: #17142b; }
      .btn-delete { color: #d6455d; background: #ffe4e8; }
      .btn-delete:hover { background: #d6455d; color: white; }

      /* Modals */
      .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(23, 20, 43, 0.65); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; visibility: hidden; transition: 0.3s; }
      .custom-modal-overlay.active { opacity: 1; visibility: visible; }
      .custom-modal { background: #ffffff; border-radius: 24px; padding: 35px; width: 100%; max-width: 440px; text-align: left; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
      .viewer-modal { max-width: 1000px !important; width: 95%; height: 90vh; display: flex; flex-direction: column; padding: 25px; text-align: center; }
      .viewer-iframe { flex-grow: 1; width: 100%; border: 2px solid #e7e2f2; border-radius: 16px; margin-bottom: 20px; background: #f5f3fa; }

      label { display: block; color: #17142b; font-weight: 600; margin-bottom: 6px; font-size: 13px; text-transform: uppercase; }
      .modal-input { width: 100%; padding: 12px 16px; border: 2px solid #e2ddeb; border-radius: 12px; outline: none; background: #f8f7fb; font-size: 14px; margin-bottom: 16px; color: #17142b; }
      .modal-input:focus { border-color: #7c5cff; background: white; }
      
      /* Clean, Consolidated Custom SweetAlert Popup Styling */
      .swal2-popup.swal2-custom-popup {
        width: 360px !important; /* Restricts the overall width */
        padding: 25px 20px !important; /* Reduces the thick white space inside */
        border-radius: 28px !important;
        font-family: 'Inter', sans-serif !important;
        box-shadow: 0 20px 40px rgba(23, 20, 43, 0.12) !important;
        border: 1px solid #e7e2f2 !important;
      }
      .swal2-ok-btn {
        background: #7c5cff !important;
        color: white !important;
        border: none !important;
        padding: 12px 32px !important;
        border-radius: 14px !important;
        font-weight: 600 !important;
        font-size: 14px !important;
        cursor: pointer !important;
        box-shadow: 0 4px 12px rgba(124, 92, 255, 0.25) !important;
      }
      .swal2-confirm-btn {
        background: #16805b !important;
        color: white !important;
        border: none !important;
        padding: 12px 28px !important;
        border-radius: 14px !important;
        font-weight: 600 !important;
        font-size: 14px !important;
        cursor: pointer !important;
        margin: 0 6px !important;
        transition: 0.2s !important;
        box-shadow: 0 4px 12px rgba(22, 128, 91, 0.2) !important;
      }
      .swal2-confirm-btn:hover { opacity: 0.9; transform: translateY(-1px); }
      .swal2-danger-btn {
        background: #d6455d !important;
        color: white !important;
        border: none !important;
        padding: 12px 24px !important;
        border-radius: 14px !important;
        font-weight: 600 !important;
        font-size: 14px !important;
        cursor: pointer !important;
        margin: 0 6px !important;
      }
      .swal2-danger-btn:hover { opacity: 0.9; transform: translateY(-1px); }
      .swal2-cancel-btn {
        background: #6b6678 !important;
        color: white !important;
        border: none !important;
        padding: 12px 28px !important;
        border-radius: 14px !important;
        font-weight: 600 !important;
        font-size: 14px !important;
        cursor: pointer !important;
        margin: 0 6px !important;
        transition: 0.2s !important;
      }
      .swal2-cancel-btn:hover { opacity: 0.9; transform: translateY(-1px); }

      /* Global Mobile Responsiveness */
      @media (max-width: 768px) {
        .sidebar {
          transform: translateX(-100%);
        }
        .sidebar:not(.closed) {
          transform: translateX(0);
        }
        .main-content {
          margin-left: 0 !important;
          width: 100% !important;
          padding: 20px 18px !important;
        }
        .open-btn {
          display: flex !important;
          align-items: center;
          justify-content: center;
        }
        .welcome-banner {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
          padding: 25px 20px;
        }
        .action-bar {
          flex-direction: column;
          align-items: stretch;
        }
        .action-btn-custom {
          justify-content: center;
        }
        .doc-list-item {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
        }
        .doc-actions-wrapper {
          width: 100%;
          justify-content: space-between;
        }
      }

      /* Compact, Mobile-Friendly SweetAlert Custom Popup */
      .swal2-popup.swal2-custom-popup {
        width: 360px !important;
        max-width: 90vw !important; /* Prevents edge-clipping on small mobile screens */
        padding: 25px 20px !important; /* Reduces vertical white space */
        border-radius: 28px !important;
        font-family: 'Inter', sans-serif !important;
        box-shadow: 0 20px 40px rgba(23, 20, 43, 0.12) !important;
        border: 1px solid #e7e2f2 !important;
      }
    </style>
  </head>

  <body>
    <!-- Unified Sidebar -->
    <div class="sidebar">
      <div class="logo-container">
        <i class="fa-solid fa-bars close-btn" id="closeSidebar" title="Collapse Menu"></i>
        <img src="/nobglogo.png" alt="CSUISS Logo" class="sidebar-logo" />
      </div>
      <div class="nav-menu">
        <a href="/dashboard" class="nav-link"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="/upload" class="nav-link"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Document</a>
        <a href="/documents" class="nav-link active"><i class="fa-regular fa-file-lines"></i> My Documents</a>
        <a href="/activity-log" class="nav-link"><i class="fa-solid fa-chart-line"></i> Activity Log</a>
        <a href="/recycle-bin" class="nav-link"><i class="fa-solid fa-trash-can-arrow-up"></i> Recycle Bin</a>
        <a href="/admin" class="nav-link"><i class="fa-solid fa-gear"></i> Admin Panel</a>
      </div>
      <div class="sidebar-profile">
        <div class="profile-info">
          <i class="fa-solid fa-circle-user"></i>
          <div>
            <div style="font-size: 11px; color: #a7f3d0; margin-bottom: 2px;">ISS-DS Portal</div>
            <div style="font-weight: bold; color: white;" id="userDisplay">User</div>
          </div>
        </div>
        <a href="/logout" class="logout-btn" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <i class="fa-solid fa-bars open-btn" id="openSidebar" title="Open Menu"></i>

      <div class="welcome-banner">
        <div class="welcome-text">
          <h1>My Documents 📂</h1>
        </div>
        <div class="date-badge">
          <i class="fa-regular fa-calendar-check"></i>
          <span id="currentDateDisplay">Date</span>
        </div>
      </div>

      <!-- Action Bar -->
      <div class="action-bar">
        <div class="search-container">
          <i class="fa-solid fa-search" style="color: #7c5cff;"></i>
          <input type="text" id="searchInput" placeholder="Search across all repository files..." />
        </div>
        <a href="/upload" class="action-btn-custom"><i class="fa-solid fa-cloud-arrow-up"></i> Upload File</a>
        <button class="action-btn-custom" onclick="promptCreateMainFolder()" style="background: linear-gradient(135deg, #23b1ca 0%, #16805b 100%);">
          <i class="fa-solid fa-folder-plus"></i> New Category
        </button>
      </div>

      <!-- Container that switches views -->
      <div id="repositoryContainer"></div>
    </div>

    <!-- Edit Document Metadata Modal (FR-003) -->
    <div class="custom-modal-overlay" id="editDocumentModal">
      <div class="custom-modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="margin: 0; color: #17142b; font-size: 20px; font-weight: 700;">
            <i class="fa-solid fa-pen-to-square" style="color: #7c5cff; margin-right: 8px;"></i> Edit Document
          </h3>
          <button id="closeEditBtn" style="background: #f5f3fa; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; color: #6b6678;">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        
        <form id="editDocumentForm">
          <input type="hidden" id="editDocId" />
          
          <label>Document Title</label>
          <input type="text" id="editTitle" class="modal-input" required />
          
          <label>Category / Folder</label>
          <select id="editCategory" class="modal-input" required></select>
          
          <label>Document Date</label>
          <input type="date" id="editDate" class="modal-input" required />
          
          <button type="submit" class="action-btn-custom" style="width: 100%; justify-content: center; margin-top: 10px;">Save Changes</button>
        </form>
      </div>
    </div>

    <!-- Document Viewer Modal -->
    <div class="custom-modal-overlay" id="documentViewerModal">
      <div class="custom-modal viewer-modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="margin: 0; color: #0f172a; font-size: 20px; font-weight: 700;" id="viewerTitle">Document Preview</h3>
          <button id="closeViewerBtn" style="background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; color: #64748b;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <iframe id="documentIframe" class="viewer-iframe" src=""></iframe>
        <div style="display: flex; justify-content: flex-end;">
          <a href="#" id="viewerDownloadBtn" download class="back-btn" style="text-decoration: none;"><i class="fa-solid fa-cloud-arrow-down"></i> Download Original</a>
        </div>
      </div>
    </div>

    <script>
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-US', options);

      let allDocuments = [];
      let currentUserRole = "";
      let activeMainFolder = null; 
      let activeSubFolder = null;  

      let mainFolders = JSON.parse(localStorage.getItem('iss_ds_main_folders')) || ["Records", "Finance", "Reports", "Memos", "Events"];
      
      let subFoldersMap = JSON.parse(localStorage.getItem('iss_ds_subfolders')) || { 
        "Memos": [
          "Memo for officer only (Signatories addresses until LCO unit head)",
          "Org wide memo (Signatories addresses until VTAA)"
        ],
        "Records": [
          "Resolution",
          "Minutes of the meeting"
        ],
        "Reports": [
          "Activity design",
          "Utilization"
        ],
        "Events": [
          "Tech Seminar",
          "Community Outreach"
        ]
      };

      async function fetchDocumentsData() {
        try {
          const response = await fetch("/api/documents");
          const apiResult = await response.json();
          allDocuments = apiResult.documents;
          currentUserRole = apiResult.userRole;

          const userDisplayEl = document.getElementById("userDisplay");
          if (userDisplayEl && currentUserRole) {
            userDisplayEl.innerHTML = `@${currentUserRole} <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 5px;"></i>`;
          }

          renderView();
        } catch (error) {
          console.error("Error fetching documents:", error);
        }
      }

      window.onload = fetchDocumentsData;

      // Custom Success UI Popup
      async function showSuccessPopup(message = "Document metadata saved successfully.") {
        return Swal.fire({
          html: `
            <div style="display: flex; flex-direction: column; align-items: center; padding: 10px 0 0 0;">
              <div style="width: 72px; height: 72px; background: rgba(22, 128, 91, 0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                <i class="fa-solid fa-circle-check" style="font-size: 34px; color: #16805b;"></i>
              </div>
              <h2 style="font-size: 22px; font-weight: 700; color: #17142b; margin-bottom: 8px; letter-spacing: -0.5px;">Updated!</h2>
              <p style="font-size: 14px; color: #6b6678; text-align: center; margin-bottom: 25px; line-height: 1.5;">${message}</p>
            </div>
          `,
          confirmButtonText: 'OK',
          buttonsStyling: false,
          customClass: {
            popup: 'swal2-custom-popup',
            confirmButton: 'swal2-ok-btn'
          }
        });
      }

      function renderView() {
        const container = document.getElementById("repositoryContainer");

        if (activeMainFolder === null) {
          const grouped = allDocuments.reduce((acc, doc) => {
            if (!acc[doc.category]) acc[doc.category] = [];
            acc[doc.category].push(doc);
            return acc;
          }, {});

          let gridHtml = '<div class="folders-grid">';
          mainFolders.forEach(cat => {
            if (currentUserRole === 'Officer' && cat.toLowerCase() === 'finance') return; 
            
            const count = grouped[cat] ? grouped[cat].length : 0;
           let icon = "fa-folder-closed";
            const lowerCat = cat.toLowerCase();
            if (lowerCat.includes("finance")) icon = "fa-file-invoice-dollar";
            else if (lowerCat.includes("report")) icon = "fa-chart-pie";
            else if (lowerCat.includes("memo")) icon = "fa-file-pen";
            else if (lowerCat.includes("event") || cat === "Events") icon = "fa-calendar-days";
            else if (lowerCat.includes("record")) icon = "fa-box-archive";

            gridHtml += `
              <div class="folder-card" onclick="openMainFolder('${cat}')">
                <div class="folder-icon-wrapper"><i class="fa-solid ${icon}"></i></div>
                <h3>${cat}</h3>
                <p>${count} total file${count === 1 ? '' : 's'}</p>
              </div>
            `;
          });
          gridHtml += '</div>';
          container.innerHTML = gridHtml;

        } else if (activeSubFolder === null) {
          const subs = subFoldersMap[activeMainFolder] || [];
          
          let html = `
            <div class="folder-view-header">
              <button class="back-btn" onclick="closeMainFolder()"><i class="fa-solid fa-arrow-left"></i> All Categories</button>
              <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <h2 style="font-size: 18px; color: #17142b;"><i class="fa-solid fa-folder-open" style="color: #7c5cff;"></i> ${activeMainFolder}</h2>
                <button class="action-btn-custom" onclick="promptCreateSubFolder('${activeMainFolder}')" style="padding: 8px 16px; font-size: 13px;">
                  <i class="fa-solid fa-folder-plus"></i> Add Subfolder
                </button>
              </div>
            </div>
            <div class="folders-grid">
              <div class="folder-card" onclick="openSubFolder('General')">
                <div class="folder-icon-wrapper" style="background: #e8f8f1; color: #16805b;"><i class="fa-solid fa-folder-open"></i></div>
                <h3>General / Unassigned</h3>
                <p>View root files</p>
              </div>
          `;

          subs.forEach((sub, idx) => {
            html += `
              <div class="folder-card" onclick="openSubFolder('${sub}')">
                <div class="subfolder-actions" onclick="event.stopPropagation();">
                  <button class="subfolder-action-btn" onclick="promptRenameSubFolder('${activeMainFolder}', ${idx})" title="Rename"><i class="fa-solid fa-pen"></i></button>
                  <button class="subfolder-action-btn delete" onclick="promptDeleteSubFolder('${activeMainFolder}', ${idx})" title="Delete Subfolder"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="folder-icon-wrapper"><i class="fa-solid fa-folder"></i></div>
                <h3>${sub}</h3>
                <p>Subfolder</p>
              </div>
            `;
          });
          html += '</div>';
          container.innerHTML = html;

        } else {
          let folderDocs = allDocuments.filter(doc => doc.category === activeMainFolder);
          if (activeSubFolder !== 'General') {
            folderDocs = folderDocs.filter(doc => doc.subfolder === activeSubFolder);
          } else {
            folderDocs = folderDocs.filter(doc => !doc.subfolder || doc.subfolder === 'General');
          }

          let html = `
            <div class="folder-view-header">
              <button class="back-btn" onclick="closeSubFolder()"><i class="fa-solid fa-arrow-left"></i> Back to Subfolders</button>
              <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <h2 style="font-size: 18px; color: #17142b;">
                  <i class="fa-solid fa-file-lines" style="color: #7c5cff;"></i> ${activeMainFolder} &rsaquo; ${activeSubFolder}
                </h2>
                <a href="/upload?category=${encodeURIComponent(activeMainFolder)}&subfolder=${encodeURIComponent(activeSubFolder)}" class="action-btn-custom" style="padding: 8px 16px; font-size: 13px;">
                  <i class="fa-solid fa-cloud-arrow-up"></i> Upload Here
                </a>
              </div>
            </div>
          `;

          if (folderDocs.length === 0) {
            html += '<div style="text-align: center; padding: 50px; background: white; border-radius: 20px; color: #918ba1; border: 1px solid #e7e2f2;"><i class="fa-solid fa-folder-open" style="font-size: 44px; margin-bottom: 15px; color: #d2cbe6;"></i><br>No documents found in this subfolder.</div>';
          } else {
            folderDocs.forEach((doc) => {
              const filePath = `/repository/${doc.category}/${doc.standardized_file_name}`;
              const fileExt = doc.standardized_file_name.split(".").pop().toLowerCase();

              let iconClass = "fa-file-lines"; let iconColor = "icon-doc";
              if (fileExt === "pdf") { iconClass = "fa-file-pdf"; iconColor = "icon-pdf"; }
              if (["xls", "xlsx"].includes(fileExt)) { iconClass = "fa-file-excel"; iconColor = "icon-xls"; }

              const dDate = new Date(doc.document_date).toLocaleDateString();
              let approvalHtml = doc.approval_status === "Approved" ? 
                `<span class="approval-badge badge-approved"><i class="fa-solid fa-circle-check"></i> Approved</span>` : 
                (currentUserRole === "President" ? `<button onclick="approveDocument(${doc.id})" class="approval-badge badge-pending" style="cursor: pointer; border: 1px solid #d97706;"><i class="fa-solid fa-check"></i> Approve</button>` : `<span class="approval-badge badge-pending"><i class="fa-solid fa-clock"></i> Pending</span>`);

              html += `
                <div class="doc-list-item">
                    <div class="doc-info-wrapper">
                        <i class="fa-solid ${iconClass} list-icon ${iconColor}"></i>
                        <div class="doc-details">
                            <h4 title="${doc.standardized_file_name}">${doc.standardized_file_name}</h4>
                            <p>
                                <span><i class="fa-regular fa-calendar"></i> ${dDate}</span>
                                <span><i class="fa-solid fa-code-branch"></i> v${doc.version_number}</span>
                            </p>
                        </div>
                    </div>
                    <div class="doc-actions-wrapper">
                        ${approvalHtml}
                        <button onclick="openEditModal(${doc.id}, '${doc.title.replace(/'/g, "&apos;").replace(/"/g, "&quot;")}', '${doc.category}', '${new Date(doc.document_date).toISOString().split('T')[0]}')" class="btn-edit" title="Edit Metadata"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="openDocumentViewer('${filePath}', '${doc.standardized_file_name}', ${doc.id})" class="btn-view">Preview <i class="fa-solid fa-arrow-right" style="font-size: 10px;"></i></button>
                        <a href="${filePath}" download class="btn-download" title="Download File"><i class="fa-solid fa-cloud-arrow-down"></i></a>
                        <button onclick="moveToRecycleBin(${doc.id})" class="btn-delete" title="Move to Recycle Bin"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
              `;
            });
          }
          container.innerHTML = html;
        }
      }

      window.openMainFolder = function(folderName) {
        activeMainFolder = folderName;
        activeSubFolder = null;
        renderView();
      }

      window.closeMainFolder = function() {
        activeMainFolder = null;
        renderView();
      }

      window.openSubFolder = function(subName) {
        activeSubFolder = subName;
        renderView();
      }

      window.closeSubFolder = function() {
        activeSubFolder = null;
        renderView();
      }

      async function promptCreateMainFolder() {
        const { value: folderName } = await Swal.fire({
          title: 'Create Main Category',
          input: 'text',
          inputPlaceholder: 'Enter category name...',
          showCancelButton: true,
          confirmButtonColor: '#7c5cff',
          cancelButtonColor: '#6b6678',
          inputValidator: (value) => {
            if (!value) return 'Folder name cannot be empty!';
            if (mainFolders.includes(value.trim())) return 'Category already exists!';
          }
        });

        if (folderName) {
          const newName = folderName.trim();
          mainFolders.push(newName);
          localStorage.setItem('iss_ds_main_folders', JSON.stringify(mainFolders));
          Swal.fire("Created!", `Category "${newName}" added.`, "success");
          renderView();
        }
      }

      async function promptCreateSubFolder(parentCategory) {
        const { value: subName } = await Swal.fire({
          title: 'Create New Subfolder',
          input: 'text',
          inputPlaceholder: 'Enter subfolder name...',
          showCancelButton: true,
          confirmButtonColor: '#7c5cff'
        });

        if (subName) {
          if (!subFoldersMap[parentCategory]) subFoldersMap[parentCategory] = [];
          subFoldersMap[parentCategory].push(subName.trim());
          localStorage.setItem('iss_ds_subfolders', JSON.stringify(subFoldersMap));

          await fetch('/api/activity/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action_type: 'CREATE FOLDER', result: `Created subfolder "${subName.trim()}" under ${parentCategory}` })
          });

          Swal.fire('Success', 'Subfolder created successfully.', 'success');
          renderView();
        }
      }

      async function promptDeleteSubFolder(parentCat, index) {
        if (currentUserRole === 'Officer') {
          Swal.fire({ title: 'Access Denied', text: 'Officers do not have permission to delete subfolders.', icon: 'error' });
          return;
        }

        const subName = subFoldersMap[parentCat][index];
        const confirmation = await Swal.fire({
          title: `Delete Subfolder "${subName}"?`,
          text: "This folder and its contents will be moved to the Recycle Bin.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: '#d6455d'
        });

        if (confirmation.isConfirmed) {
          let recycleBin = JSON.parse(localStorage.getItem('iss_ds_recycle_bin')) || [];
          recycleBin.push({ type: 'folder', name: subName, parent: parentCat, deletedAt: new Date().toISOString() });
          localStorage.setItem('iss_ds_recycle_bin', JSON.stringify(recycleBin));

          subFoldersMap[parentCat].splice(index, 1);
          localStorage.setItem('iss_ds_subfolders', JSON.stringify(subFoldersMap));

          await fetch('/api/activity/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action_type: 'DELETE FOLDER', result: `Moved folder "${subName}" to Recycle Bin` })
          });

          Swal.fire("Moved to Recycle Bin", "Subfolder has been moved successfully.", "success");
          renderView();
        }
      }

      async function promptRenameSubFolder(parentCat, index) {
        if (currentUserRole === 'Officer') {
          Swal.fire({
            title: 'Access Denied',
            text: 'Officers do not have permission to rename subfolders.',
            icon: 'error',
            confirmButtonColor: '#7c5cff'
          });
          return;
        }

        const currentName = subFoldersMap[parentCat][index];
        const { value: newName } = await Swal.fire({
          title: `Rename Subfolder`,
          input: 'text',
          inputValue: currentName,
          showCancelButton: true,
          confirmButtonColor: '#7c5cff',
          cancelButtonColor: '#6b6678',
          inputValidator: (value) => {
            if (!value) return 'New name cannot be empty!';
            if (subFoldersMap[parentCat].includes(value.trim()) && value.trim() !== currentName) return 'Subfolder with this name already exists!';
          }
        });

        if (newName) {
          subFoldersMap[parentCat][index] = newName.trim();
          localStorage.setItem('iss_ds_subfolders', JSON.stringify(subFoldersMap));
          Swal.fire("Renamed!", "Subfolder updated successfully.", "success");
          renderView();
        }
      }

      // Edit Document Metadata Logic
      const editDocumentModal = document.getElementById('editDocumentModal');
      const editDocumentForm = document.getElementById('editDocumentForm');

      window.openEditModal = function(id, title, category, date) {
        document.getElementById('editDocId').value = id;
        document.getElementById('editTitle').value = title.replace(/&apos;/g, "'").replace(/&quot;/g, '"');
        
        const catSelect = document.getElementById('editCategory');
        catSelect.innerHTML = "";
        mainFolders.forEach(cat => {
          catSelect.innerHTML += `<option value="${cat}" ${cat === category ? 'selected' : ''}>${cat}</option>`;
        });

        document.getElementById('editDate').value = date;
        editDocumentModal.classList.add('active');
      };

      document.getElementById('closeEditBtn').addEventListener('click', () => {
        editDocumentModal.classList.remove('active');
      });

      editDocumentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editDocId').value;
        const title = document.getElementById('editTitle').value;
        const category = document.getElementById('editCategory').value;
        const date = document.getElementById('editDate').value;
        
        try {
          const response = await fetch(`/api/documents/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, category, date })
          });

          if (response.ok) {
            // Using our custom Success Popup
            showSuccessPopup("Document metadata saved successfully.").then(() => {
              editDocumentModal.classList.remove('active');
              fetchDocumentsData();
            });
          } else {
            const errText = await response.text();
            Swal.fire("Access Denied", errText, "error");
          }
        } catch (error) {
          console.error(error);
          Swal.fire("Error", "A network error occurred.", "error");
        }
      });

      // Global Live Search
      const searchInput = document.getElementById("searchInput");
      searchInput.addEventListener("input", function(e) {
        const term = e.target.value.toLowerCase();
        const container = document.getElementById("repositoryContainer");
        if (!term) {
          renderView();
          return;
        }
        const filtered = allDocuments.filter(doc => doc.standardized_file_name.toLowerCase().includes(term) || doc.category.toLowerCase().includes(term));
        let html = `<div class="folder-view-header"><h3 style="font-size: 16px;">Search Results for "${term}"</h3></div>`;
        if (filtered.length === 0) {
          html += '<div style="text-align: center; padding: 40px; background: white; border-radius: 20px; color: #918ba1; border: 1px solid #e7e2f2;">No matching documents found.</div>';
        } else {
          filtered.forEach(doc => {
            const filePath = `/repository/${doc.category}/${doc.standardized_file_name}`;
            html += `
              <div class="doc-list-item">
                  <div class="doc-info-wrapper">
                      <i class="fa-solid fa-file-lines list-icon icon-doc"></i>
                      <div class="doc-details">
                          <h4>${doc.standardized_file_name}</h4>
                          <p><span>Folder: ${doc.category}</span><span>v${doc.version_number}</span></p>
                      </div>
                  </div>
                  <div class="doc-actions-wrapper">
                      <button onclick="openEditModal(${doc.id}, '${doc.title.replace(/'/g, "&apos;").replace(/"/g, "&quot;")}', '${doc.category}', '${new Date(doc.document_date).toISOString().split('T')[0]}')" class="btn-edit" title="Edit Metadata"><i class="fa-solid fa-pen"></i></button>
                      <button onclick="openDocumentViewer('${filePath}', '${doc.standardized_file_name}', ${doc.id})" class="btn-view">Preview</button>
                      <a href="${filePath}" download class="btn-download"><i class="fa-solid fa-cloud-arrow-down"></i></a>
                  </div>
              </div>`;
          });
        }
        container.innerHTML = html;
      });

      // Custom Unified Delete / Move to Recycle Bin UI
      async function moveToRecycleBin(docId) {
        if (currentUserRole === 'Officer') {
          Swal.fire({
            html: `
              <div style="display: flex; flex-direction: column; align-items: center; padding: 10px 0 0 0;">
                <div style="width: 72px; height: 72px; background: rgba(214, 69, 93, 0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                  <i class="fa-solid fa-triangle-exclamation" style="font-size: 34px; color: #d6455d;"></i>
                </div>
                <h2 style="font-size: 22px; font-weight: 700; color: #17142b; margin-bottom: 8px; letter-spacing: -0.5px;">Access Denied</h2>
                <p style="font-size: 14px; color: #6b6678; text-align: center; margin-bottom: 25px; line-height: 1.5;">Officers do not have permission to delete documents.</p>
              </div>
            `,
            confirmButtonText: 'Return to Dashboard',
            buttonsStyling: false,
            customClass: { popup: 'swal2-custom-popup', confirmButton: 'swal2-danger-btn' }
          });
          return;
        }

        const confirmation = await Swal.fire({
          html: `
            <div style="display: flex; flex-direction: column; align-items: center; padding: 10px 0 0 0;">
              <div style="width: 72px; height: 72px; background: rgba(214, 69, 93, 0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                <i class="fa-solid fa-triangle-exclamation" style="font-size: 34px; color: #d6455d;"></i>
              </div>
              <h2 style="font-size: 22px; font-weight: 700; color: #17142b; margin-bottom: 8px; letter-spacing: -0.5px;">Move to Recycle Bin?</h2>
              <p style="font-size: 14px; color: #6b6678; text-align: center; margin-bottom: 25px; line-height: 1.5;">This document will be removed from the active repository.</p>
            </div>
          `,
          showCancelButton: true,
          confirmButtonText: 'Yes, Move',
          cancelButtonText: 'Cancel',
          buttonsStyling: false,
          customClass: {
            popup: 'swal2-custom-popup',
            confirmButton: 'swal2-danger-btn',
            cancelButton: 'swal2-cancel-btn'
          }
        });

        if (confirmation.isConfirmed) {
          try {
            const response = await fetch(`/api/documents/soft-delete/${docId}`, { method: 'POST' });
            if (response.ok) {
              showSuccessPopup("Document moved to recycle bin successfully.");
              fetchDocumentsData();
            } else {
              const errText = await response.text();
              Swal.fire("Error", errText, "error");
            }
          } catch (error) {
            console.error("Delete error:", error);
          }
        }
      }

      window.openDocumentViewer = function (filePath, fileName, docId) {
        document.getElementById('viewerTitle').innerText = fileName;
        document.getElementById('viewerDownloadBtn').href = filePath;
        document.getElementById('documentIframe').src = filePath;
        document.getElementById('documentViewerModal').classList.add("active");
        if(docId) { fetch(`/api/activity/log-view/${docId}`, { method: 'POST' }).catch(e => {}); }
      };

      document.getElementById("closeViewerBtn").addEventListener("click", () => {
        document.getElementById('documentViewerModal').classList.remove("active");
        document.getElementById('documentIframe').src = "";
      });

      const sidebar = document.querySelector(".sidebar");
      const mainContent = document.querySelector(".main-content");
      document.getElementById("closeSidebar").addEventListener("click", () => { sidebar.classList.add("closed"); mainContent.classList.add("expanded"); });
      document.getElementById("openSidebar").addEventListener("click", () => { sidebar.classList.remove("closed"); mainContent.classList.remove("expanded"); });

      async function approveDocument(docId) {
        const confirmation = await Swal.fire({
          html: `
            <div style="display: flex; flex-direction: column; align-items: center; padding: 10px 0 0 0;">
              <div style="width: 72px; height: 72px; background: rgba(22, 128, 91, 0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                <i class="fa-solid fa-circle-question" style="font-size: 34px; color: #16805b;"></i>
              </div>
              <h2 style="font-size: 22px; font-weight: 700; color: #17142b; margin-bottom: 8px; letter-spacing: -0.5px;">Approve Document?</h2>
              <p style="font-size: 14px; color: #6b6678; text-align: center; margin-bottom: 25px; line-height: 1.5;">This will mark the document as officially approved.</p>
            </div>
          `,
          showCancelButton: true,
          confirmButtonText: 'Yes, Approve',
          cancelButtonText: 'Cancel',
          buttonsStyling: false,
          customClass: {
            popup: 'swal2-custom-popup',
            confirmButton: 'swal2-confirm-btn',
            cancelButton: 'swal2-cancel-btn'
          }
        });

        if (confirmation.isConfirmed) {
          try {
            const response = await fetch(`/api/documents/approve/${docId}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
            });

            if (response.ok) {
              showSuccessPopup("Document has been approved successfully.");
              fetchDocumentsData();
            } else {
              const errText = await response.text();
              Swal.fire("Access Denied", errText, "error");
            }
          } catch (error) {
            console.error("Approval error:", error);
            Swal.fire("Error", "A network error occurred while approving.", "error");
          }
        }
      }
      const urlParams = new URLSearchParams(window.location.search);
    </script>
  </body>
</html>
