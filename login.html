<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS-DS | Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 60, 120, 0.12);
            text-align: center;
        }
        .icon {
            width: 65px; height: 65px; margin: 0 auto 15px;
            background: #e7f0ff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 30px;
        }
        h1 { color: #123b63; font-size: 24px; margin-bottom: 5px; }
        p { color: #777; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; color: #333; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        input {
            width: 100%; padding: 13px; border: 1px solid #d5dce5;
            border-radius: 9px; font-size: 14px; outline: none; background: #fafcff;
        }
        input:focus { border-color: #2878c8; box-shadow: 0 0 0 3px rgba(40, 120, 200, 0.1); background: white; }
        button {
            width: 100%; padding: 14px; border: none; border-radius: 9px;
            background: linear-gradient(135deg, #1769aa, #2878c8);
            color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(23, 105, 170, 0.25); }
        .error { color: #d9534f; font-size: 13px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="icon">🔐</div>
        <h1>ISS-DS Login</h1>
        <p>Access the Document Repository</p>

        <div id="errorMessage" class="error">Invalid username or password.</div>

        <form action="/api/login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <script>
        // Simple script to show error if the URL contains ?error=1
        if (window.location.search.includes('error=1')) {
            document.getElementById('errorMessage').style.display = 'block';
        }
    </script>
</body>
</html>
