<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISS-DS | Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }
      
      body {
        min-height: 100vh;
        /* Animated dynamic gradient background using your theme colors */
        background: linear-gradient(-45deg, #23b1ca, #7c5cff, #331780, #17142b);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #17142b;
        padding: 20px;
      }

      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        padding: 50px 40px;
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.6);
        /* Smooth pop-in animation on load */
        animation: popIn 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        opacity: 0;
        transform: translateY(30px);
      }

      @keyframes popIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .center-logo {
        width: 180px;
        height: auto;
        margin: 0 auto 20px;
        display: block;
        filter: drop-shadow(0px 8px 16px rgba(124, 92, 255, 0.25));
        transition: transform 0.3s ease;
      }

      .center-logo:hover {
        transform: scale(1.05);
      }

      h1 {
        color: #17142b;
        font-size: 24px;
        margin-bottom: 5px;
        font-weight: 700;
      }

      p {
        color: #6b6678;
        font-size: 14px;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 20px;
        text-align: left;
      }

      label {
        display: block;
        color: #17142b;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 13px;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-wrapper i {
        position: absolute;
        left: 16px;
        color: #918ba1;
        font-size: 16px;
        transition: 0.3s;
      }

      input {
        width: 100%;
        padding: 14px 14px 14px 45px; /* Extra left padding for the icon */
        border: 2px solid #e2ddeb;
        border-radius: 12px;
        font-size: 14px;
        outline: none;
        background: #f8f7fb;
        color: #17142b;
        transition: all 0.3s ease;
      }

      /* When input is focused, change the input border and the icon color */
      .input-wrapper:focus-within input {
        border-color: #7c5cff;
        background: white;
        box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.15);
      }

      .input-wrapper:focus-within i {
        color: #7c5cff;
      }

      button {
        width: 100%;
        padding: 15px;
        margin-top: 10px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #7c5cff 0%, #5b43c7 100%);
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(124, 92, 255, 0.3);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(124, 92, 255, 0.4);
      }

      .error {
        background: #ffe4e8;
        color: #d6455d;
        font-size: 13px;
        margin-bottom: 20px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #f08a9b;
        display: none;
        font-weight: 600;
        animation: shake 0.4s ease-in-out;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      /* Global Mobile Responsiveness */
      @media (max-width: 768px) {
        .sidebar {
          transform: translateX(-100%);
        }
        .sidebar:not(.closed) {
          transform: translateX(0);
        }
        .main-content {
          margin-left: 0 !important;
          width: 100% !important;
          padding: 20px 18px !important;
        }
        .open-btn {
          display: flex !important;
          align-items: center;
          justify-content: center;
        }
        .welcome-banner {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
          padding: 25px 20px;
        }
        .action-bar {
          flex-direction: column;
          align-items: stretch;
        }
        .action-btn-custom {
          justify-content: center;
        }
        .doc-list-item {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
        }
        .doc-actions-wrapper {
          width: 100%;
          justify-content: space-between;
        }
      }

      /* Compact, Mobile-Friendly SweetAlert Custom Popup */
      .swal2-popup.swal2-custom-popup {
        width: 360px !important;
        max-width: 90vw !important; /* Prevents edge-clipping on small mobile screens */
        padding: 25px 20px !important; /* Reduces vertical white space */
        border-radius: 28px !important;
        font-family: 'Inter', sans-serif !important;
        box-shadow: 0 20px 40px rgba(23, 20, 43, 0.12) !important;
        border: 1px solid #e7e2f2 !important;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <!-- Centered Custom Logo -->
      <img src="/nobglogo.png" alt="CSUISS Logo" class="center-logo" />
      
      <h1>Welcome Back</h1>
      <p>Sign in to access the Document Repository</p>
      
      <div id="errorMessage" class="error">
        <i class="fa-solid fa-triangle-exclamation" style="margin-right: 5px;"></i> 
        Invalid username or password.
      </div>

      <form action="/api/login" method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" placeholder="Enter your username" required />
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
          </div>
        </div>
        
        <button type="submit">Secure Sign In <i class="fa-solid fa-arrow-right" style="margin-left: 5px;"></i></button>
      </form>
    </div>

    <script>
      // Automatically display error banner if redirected with ?error=1
      if (window.location.search.includes("error=1")) {
        document.getElementById("errorMessage").style.display = "block";
      }
    </script>
  </body>
</html>
