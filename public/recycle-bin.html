<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISS-DS | Recycle Bin</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }
      body {
        background: #f4f2f9;
        display: flex;
        min-height: 100vh;
        color: #17142b;
        overflow-x: hidden;
      }

      /* Unified Sidebar matching Dashboard, Upload & Documents */
      .sidebar {
        width: 260px;
        background: linear-gradient(180deg, #23b1ca 0%, #331780 100%);
        color: white;
        display: flex;
        flex-direction: column;
        position: fixed;
        height: 100vh;
        border-top-right-radius: 24px;
        border-bottom-right-radius: 24px;
        padding: 20px 0;
        z-index: 10;
        transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 5px 0 25px rgba(51, 23, 128, 0.15);
        overflow-y: auto;
      }

      .sidebar::-webkit-scrollbar {
        display: none;
      }

      .sidebar.closed {
        transform: translateX(-100%);
      }

      .logo-container {
        text-align: center;
        margin-bottom: 20px;
        padding: 30px 20px 0 20px;
        position: relative;
      }

      .sidebar-logo {
        width: 140px;
        height: auto;
        background-color: transparent;
        padding: 0;
        filter: drop-shadow(0px 8px 12px rgba(124, 92, 255, 0.4));
        margin-bottom: 10px;
        transition: 0.3s;
      }

      .sidebar-logo:hover {
        transform: scale(1.05);
      }

      .close-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
        z-index: 100;
        color: white;
        background: rgba(255, 255, 255, 0.1);
      }

      .close-btn:hover {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 0.2);
      }

      .nav-menu {
        display: flex;
        flex-direction: column;
        padding: 0 15px;
        flex-grow: 1;
        margin-top: 10px;
        margin-bottom: 20px;
      }

      .nav-link {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 14px 20px;
        color: #d9d5ea;
        text-decoration: none;
        border-radius: 12px;
        margin-bottom: 8px;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .nav-link:hover,
      .nav-link.active {
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(5px);
      }

      .nav-link i {
        font-size: 18px;
        width: 20px;
        text-align: center;
      }

      .sidebar-profile {
        padding: 20px;
        margin: auto 15px 20px 15px;
        background: rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        backdrop-filter: blur(10px);
      }

      .profile-info {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }

      .profile-info i {
        font-size: 28px;
        color: #34d399;
      }

      .logout-btn {
        color: #f08a9b;
        text-decoration: none;
        font-size: 14px;
        padding: 8px;
        border-radius: 8px;
        transition: 0.2s;
      }

      .logout-btn:hover {
        background: rgba(240, 138, 155, 0.2);
        color: #ffb3c1;
      }

      .open-btn {
        font-size: 20px;
        color: #7c5cff;
        cursor: pointer;
        display: none;
        margin-bottom: 15px;
        background: #ffffff;
        border: 1px solid #e7e2f2;
        padding: 10px 15px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(23, 20, 43, 0.05);
        width: fit-content;
        transition: 0.2s;
      }

      .open-btn:hover {
        background: #f0eef5;
        color: #5b43c7;
      }

      .main-content {
        margin-left: 260px;
        flex-grow: 1;
        padding: 30px 45px;
        display: flex;
        flex-direction: column;
        gap: 25px;
        width: calc(100% - 260px);
        transition: margin-left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      .main-content.expanded {
        margin-left: 0;
        padding-left: 45px;
        width: 100%;
      }

      .main-content.expanded .open-btn {
        display: inline-block;
      }

      /* Creative Welcome Banner matching Dashboard */
      .welcome-banner {
        background: linear-gradient(135deg, #7c5cff 0%, #23b1ca 100%);
        border-radius: 24px;
        padding: 35px 45px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 15px 35px rgba(124, 92, 255, 0.25);
        position: relative;
        overflow: hidden;
      }

      .welcome-banner::before {
        content: '';
        position: absolute;
        top: -50px;
        right: -50px;
        width: 250px;
        height: 250px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        backdrop-filter: blur(10px);
      }

      .welcome-text {
        position: relative;
        z-index: 1;
      }

      .welcome-text h1 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }

      .welcome-text p {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.9);
      }

      .date-badge {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        padding: 12px 25px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .docs-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 25px;
      }

      .doc-card {
        background: #ffffff;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 4px 15px rgba(23, 20, 43, 0.04);
        border: 1px solid #e7e2f2;
        border-bottom: 4px solid #d6455d;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      .doc-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(23, 20, 43, 0.08);
      }

      .btn-restore {
        border: 1px solid #16805b;
        color: #16805b;
        background: #e8f8f1;
        padding: 10px 15px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: 0.3s;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .btn-restore:hover {
        background: #16805b;
        color: white;
        box-shadow: 0 4px 12px rgba(22, 128, 91, 0.2);
      }

      .btn-hard-delete {
        border: 1px solid #d6455d;
        color: #d6455d;
        background: #ffe4e8;
        padding: 10px 15px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: 0.3s;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .btn-hard-delete:hover {
        background: #d6455d;
        color: white;
        box-shadow: 0 4px 12px rgba(214, 69, 93, 0.2);
      }

      @media (max-width: 1024px) {
        .welcome-banner {
          flex-direction: column;
          align-items: flex-start;
          gap: 20px;
        }
      }

      @media (max-width: 768px) {
        .sidebar {
          transform: translateX(-100%);
        }
        .sidebar:not(.closed) {
          transform: translateX(0);
        }
        .main-content {
          margin-left: 0 !important;
          width: 100% !important;
          padding: 20px !important;
        }
        .open-btn {
          display: inline-block !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Unified Sidebar -->
    <div class="sidebar">
      <div class="logo-container">
        <i class="fa-solid fa-bars close-btn" id="closeSidebar" title="Collapse Menu"></i>
        <img src="/nobglogo.png" alt="CSUISS Logo" class="sidebar-logo" />
      </div>

      <div class="nav-menu">
        <a href="/dashboard" class="nav-link">
          <i class="fa-solid fa-house"></i> Dashboard
        </a>

        <a href="/upload" class="nav-link">
          <i class="fa-solid fa-cloud-arrow-up"></i> Upload Document
        </a>

        <a href="/documents" class="nav-link">
          <i class="fa-regular fa-file-lines"></i> My Documents
        </a>

        <a href="/activity-log" class="nav-link">
          <i class="fa-solid fa-chart-line"></i> Activity Log
        </a>

        <a href="/recycle-bin" class="nav-link active">
          <i class="fa-solid fa-trash-can-arrow-up"></i> Recycle Bin
        </a>

        <a href="/admin" class="nav-link">
          <i class="fa-solid fa-gear"></i> Admin Panel
        </a>
      </div>

      <div class="sidebar-profile">
        <div class="profile-info">
          <i class="fa-solid fa-circle-user"></i>
          <div>
            <div style="font-size: 11px; color: #a7f3d0; margin-bottom: 2px;">ISS-DS Portal</div>
            <div style="font-weight: bold; color: white;" id="userDisplay">
              User
              <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 5px"></i>
            </div>
          </div>
        </div>

        <a href="/logout" class="logout-btn" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <i class="fa-solid fa-bars open-btn" id="openSidebar" title="Open Menu"></i>

      <!-- Creative Welcome Banner matching Dashboard -->
      <div class="welcome-banner">
        <div class="welcome-text">
          <h1>Recycle Bin 🗑️</h1>
          <p>Documents deleted from the repository can be restored or permanently removed here.</p>
        </div>
        <div class="date-badge">
          <i class="fa-regular fa-calendar-check"></i>
          <span id="currentDateDisplay">Date</span>
        </div>
      </div>

      <div class="docs-grid" id="recycleBinGrid"></div>
    </div>

    <script>
      // Set current date in header badge
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-US', options);

      async function fetchDeletedDocuments() {
        try {
          const response = await fetch("/api/documents/deleted");
          const apiResult = await response.json();
          const grid = document.getElementById("recycleBinGrid");
          grid.innerHTML = "";

          if (!apiResult.documents || apiResult.documents.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; background: white; border-radius: 20px; color: #918ba1;"><i class="fa-solid fa-trash-can" style="font-size: 40px; margin-bottom: 15px; color: #d2cbe6;"></i><br>The recycle bin is currently empty.</div>';
            return;
          }

          apiResult.documents.forEach((doc) => {
            const card = document.createElement("div");
            card.className = "doc-card";

            card.innerHTML = `
              <div>
                <div style="margin-bottom: 20px;">
                    <span style="background: #f5f3fa; color: #5b43c7; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
                        <i class="fa-solid fa-folder" style="margin-right: 4px;"></i> ${doc.category}
                    </span>
                </div>
                <div style="text-align: center; font-size: 50px; margin-bottom: 20px; color: #918ba1;">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                <div style="font-size: 15px; font-weight: 700; color: #17142b; margin-bottom: 10px; word-break: break-all; line-height: 1.4;">${doc.standardized_file_name}</div>
                <div style="font-size: 12px; color: #918ba1; margin-bottom: 25px; font-weight: 500;">
                    <i class="fa-regular fa-calendar" style="margin-right: 5px;"></i> Version v${doc.version_number}
                </div>
              </div>
              <div style="display: flex; gap: 12px; border-top: 1px solid #f5f3fa; padding-top: 20px;">
                  <button onclick="restoreDocument(${doc.id})" class="btn-restore"><i class="fa-solid fa-rotate-left"></i> Restore</button>
                  <button onclick="hardDeleteDocument(${doc.id})" class="btn-hard-delete"><i class="fa-solid fa-fire"></i> Delete</button>
              </div>
            `;
            grid.appendChild(card);
          });
        } catch (error) {
          console.error("Error fetching deleted documents:", error);
        }
      }

      async function restoreDocument(docId) {
        const confirmation = await Swal.fire({
          title: "Restore Document?",
          text: "This document will be returned to the repository.",
          icon: "question",
          showCancelButton: true,
          confirmButtonColor: "#16805b",
          cancelButtonColor: "#6b6678",
          confirmButtonText: "Yes, Restore"
        });

        if (confirmation.isConfirmed) {
          const response = await fetch(`/api/documents/restore/${docId}`, {
            method: "POST",
          });
          if (response.ok) {
            Swal.fire(
              "Restored!",
              "Document restored successfully.",
              "success",
            );
            fetchDeletedDocuments();
          }
        }
      }

      async function hardDeleteDocument(docId) {
        const confirmation = await Swal.fire({
          title: "Permanently Delete?",
          text: "This action cannot be undone!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#d6455d",
          cancelButtonColor: "#6b6678",
          confirmButtonText: "Yes, Permanently Delete"
        });

        if (confirmation.isConfirmed) {
          const response = await fetch(
            `/api/documents/permanent-delete/${docId}`,
            { method: "DELETE" },
          );
          if (response.ok) {
            Swal.fire(
              "Deleted!",
              "Permanently removed from the system.",
              "success",
            );
            fetchDeletedDocuments();
          }
        }
      }

      window.onload = fetchDeletedDocuments;

      const sidebar = document.querySelector(".sidebar");
      const mainContent = document.querySelector(".main-content");

      document.getElementById("closeSidebar").addEventListener("click", () => {
        sidebar.classList.add("closed");
        mainContent.classList.add("expanded");
      });

      document.getElementById("openSidebar").addEventListener("click", () => {
        sidebar.classList.remove("closed");
        mainContent.classList.remove("expanded");
      });

      // Quietly fetch from the existing documents API just to grab the user role
      fetch("/api/documents")
        .then((response) => response.json())
        .then((data) => {
          const userDisplayEl = document.getElementById("userDisplay");

          if (userDisplayEl && data.userRole) {
            userDisplayEl.innerHTML = `@${data.userRole} <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 5px;"></i>`;
          }
        })
        .catch((error) => console.error("Error fetching user role:", error));
    </script> 
  </body>
</html>
