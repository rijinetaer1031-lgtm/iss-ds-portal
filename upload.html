<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISS-DS | Upload Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }

      body {
        background: #f5f3fa;
        display: flex;
        min-height: 100vh;
        color: #17142b;
      }

      /* Unified Sidebar */
      .sidebar {
        width: 260px;
        background: linear-gradient(180deg, #17142b 0%, #25203d 100%);
        color: white;
        display: flex;
        flex-direction: column;
        position: fixed;
        height: 100vh;
        border-top-right-radius: 20px;
        border-bottom-right-radius: 20px;
        padding: 20px 0;
        z-index: 10;
        transition: transform 0.3s ease;
      }

      .sidebar.closed {
        transform: translateX(-100%);
      }

      .logo-container {
        text-align: center;
        margin-bottom: 30px;
        padding: 30px 20px 0 20px;
        position: relative;
      }

      .sidebar-logo {
        width: 130px;
        height: auto;
        background-color: transparent;
        padding: 0;
        filter: drop-shadow(0px 0px 12px rgba(124, 92, 255, 0.45));
        margin-bottom: 10px;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
        z-index: 100;
      }

      .close-btn:hover {
        transform: scale(1.05);
      }

      .nav-menu {
        display: flex;
        flex-direction: column;
        padding: 0 15px;
        flex-grow: 1;
      }

      .nav-link {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 12px 20px;
        color: #d9d5ea;
        text-decoration: none;
        border-radius: 10px;
        margin-bottom: 5px;
        font-size: 14px;
        transition: 0.3s;
      }

      .nav-link:hover,
      .nav-link.active {
        background: linear-gradient(90deg, #7c5cff, #6a4de0);
        color: #ffffff;
        font-weight: 600;
      }

      .nav-link i {
        font-size: 18px;
        width: 20px;
        text-align: center;
      }

      .sidebar-profile {
        padding: 20px;
        margin: 0 15px;
        background: rgba(124, 92, 255, 0.12);
        border: 1px solid rgba(124, 92, 255, 0.25);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .profile-info {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }

      .profile-info i {
        font-size: 24px;
        color: #34d399;
      }

      .logout-btn {
        color: #f08a9b;
        text-decoration: none;
        font-size: 14px;
      }

      .logout-btn:hover {
        color: #d6455d;
      }

      .open-btn {
        font-size: 24px;
        color: #7c5cff;
        cursor: pointer;
        display: none;
        margin-bottom: 20px;
        transition: 0.2s;
      }

      .open-btn:hover {
        color: #5b43c7;
      }

      .main-content.expanded .open-btn {
        display: inline-block;
      }

      /* Main Content Layout */
      .main-content {
        margin-left: 260px;
        flex-grow: 1;
        padding: 40px;
        display: flex;
        flex-direction: column;
        width: calc(100% - 260px);
        transition:
          margin-left 0.3s ease,
          width 0.3s ease;
      }

      .main-content.expanded {
        margin-left: 0;
        padding-left: 40px;
        width: 100%;
      }

      /* Form Specific Styles */
      .upload-container {
        width: 100%;
        max-width: 650px;
        background: #ffffff;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(23, 20, 43, 0.06);
        border: 1px solid #e7e2f2;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        margin-bottom: 25px;
      }

      .header h1 {
        color: #17142b;
        font-size: 24px;
        margin-bottom: 5px;
        font-weight: 700;
      }

      .header p {
        color: #6b6678;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        color: #25203d;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 13px;
      }

      input[type="text"],
      input[type="date"],
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #e2ddeb;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        background: #f8f7fb;
        color: #17142b;
      }

      input:focus,
      select:focus {
        border-color: #7c5cff;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.1);
      }

      .file-box {
        border: 2px dashed #d6d1e1;
        border-radius: 10px;
        padding: 25px;
        text-align: center;
        background: #f8f7fb;
        transition: 0.2s;
      }

      .file-box:hover {
        border-color: #34d399;
        background: #e8f8f1;
      }

      input[type="file"] {
        border: none;
        padding: 5px;
        background: #eee9ff;
        color: #5b43c7;
        width: 100%;
        border-radius: 6px;
      }

      button[type="submit"] {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(90deg, #7c5cff, #6a4de0);
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button[type="submit"]:hover {
        background: linear-gradient(90deg, #5b43c7, #5140ad);
        box-shadow: 0 6px 18px rgba(124, 92, 255, 0.25);
      }

      .required {
        color: #d6455d;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div class="logo-container">
        <i
          class="fa-solid fa-bars close-btn"
          id="closeSidebar"
          title="Collapse Menu"
        ></i>

        <img src="/nobglogo.png" alt="CSUISS Logo" class="sidebar-logo" />
      </div>

      <div class="nav-menu">
        <a href="/dashboard" class="nav-link">
          <i class="fa-solid fa-house"></i> Dashboard
        </a>

        <a href="/upload" class="nav-link active">
          <i class="fa-solid fa-cloud-arrow-up"></i> Upload Document
        </a>

        <a href="/documents" class="nav-link">
          <i class="fa-regular fa-file-lines"></i> My Documents
        </a>

        <a href="/activity-log" class="nav-link">
          <i class="fa-solid fa-chart-line"></i> Activity Log
        </a>

        <a href="/admin" class="nav-link">
          <i class="fa-solid fa-gear"></i> Admin Panel
        </a>
      </div>

      <div class="sidebar-profile">
        <div class="profile-info">
          <i class="fa-solid fa-circle-user"></i>

          <div>
            <div style="font-size: 11px; color: #b9f3d8">ISS-DS Portal</div>

            <div style="font-weight: bold" id="userDisplay">
              User
              <i
                class="fa-solid fa-chevron-down"
                style="font-size: 10px; margin-left: 5px"
              ></i>
            </div>
          </div>
        </div>

        <a href="/logout" class="logout-btn" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </a>
      </div>
    </div>

    <div class="main-content">
      <i
        class="fa-solid fa-bars open-btn"
        id="openSidebar"
        title="Open Menu"
        style="align-self: flex-start"
      ></i>

      <div class="upload-container">
        <div class="header">
          <h1>Upload Document</h1>
          <p>Add a new document version to the ISS-DS repository</p>
        </div>

        <form action="/api/upload" method="POST" enctype="multipart/form-data">
          <div class="form-group">
            <label for="title">
              Document Title <span class="required">*</span>
            </label>

            <input
              type="text"
              id="title"
              name="title"
              required
              placeholder="e.g., Q3 Meeting Minutes"
            />
          </div>

          <div class="form-group">
            <label for="category">
              Category <span class="required">*</span>
            </label>

            <select id="category" name="category" required>
              <option value="" disabled selected>Select a category</option>
              <option value="Reports">📊 Reports</option>
              <option value="Memos">📝 Memos</option>
              <option value="Records">📂 Records</option>
              <option value="Finance">💰 Finance</option>
            </select>
          </div>

          <div class="form-group">
            <label for="date">
              Document Date <span class="required">*</span>
            </label>

            <input type="date" id="date" name="date" required />
          </div>

          <div class="form-group">
            <label for="file">
              Select Document <span class="required">*</span>
            </label>

            <div class="file-box">
              <p style="color: #6b6678; font-size: 13px; margin-bottom: 10px">
                Choose the file you want to upload
              </p>

              <input type="file" id="file" name="file" required />
            </div>
          </div>

          <button type="submit">Upload Document</button>
        </form>
      </div>
    </div>

    <script>
      const sidebar = document.querySelector(".sidebar");
      const mainContent = document.querySelector(".main-content");

      document.getElementById("closeSidebar").addEventListener("click", () => {
        sidebar.classList.add("closed");
        mainContent.classList.add("expanded");
      });

      document.getElementById("openSidebar").addEventListener("click", () => {
        sidebar.classList.remove("closed");
        mainContent.classList.remove("expanded");
      });
    </script>

    <script>
      // Quietly fetch from the existing documents API just to grab the user role
      fetch("/api/documents")
        .then((response) => response.json())
        .then((data) => {
          const userDisplayEl = document.getElementById("userDisplay");

          if (userDisplayEl && data.userRole) {
            userDisplayEl.innerHTML = `@${data.userRole} <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 5px;"></i>`;
          }
        })
        .catch((error) => console.error("Error fetching user role:", error));
    </script>
  </body>
</html>
